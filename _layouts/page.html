---
layout: base
---
<header class="page-hero">
  <div class="wrap">
    {% if page.eyebrow %}<div class="eyebrow">{{ page.eyebrow }}</div>{% endif %}
    <h1>{{ page.title }}</h1>
    {% if page.subtitle %}<p>{{ page.subtitle }}</p>{% endif %}
  </div>
</header>
<main class="wrap page-body">
  {{ content }}
</main>
